<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficjalne linki – O3K4RR</title>
<meta name="description" content="Oficjalne linki O3K4RR: TikTok, Instagram, Discord i strona internetowa.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="https://o3k4rr.pages.dev/themes/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--white:#fff;--grey:#d9d9d9;--grey-d:#6b6b6b;--grey-l:#efefef;--r:22px;--ease:cubic-bezier(.4,0,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--black);background:var(--white);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px #000}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:min(1280px,100% - 48px);margin-inline:auto}

/* ===== HEADER ===== */
.site-head{position:sticky;top:0;z-index:50;background:#000;color:#fff;box-shadow:0 0 0 rgba(0,0,0,0);transition:box-shadow .3s var(--ease)}
.site-head.is-scrolled{box-shadow:0 6px 18px rgba(0,0,0,.25)}
.topbar{background:var(--grey);color:var(--grey-d);font-size:15px;text-transform:uppercase;max-height:42px;overflow:hidden;transition:max-height .35s var(--ease),opacity .25s var(--ease)}
.topbar-in{height:42px;display:flex;justify-content:center;align-items:center;gap:32px;padding:0 16px}
.topbar a,.topbar span{display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.topbar svg{width:26px;height:26px}
.topbar a:hover{color:#000}
.head-main{display:flex;align-items:center;gap:28px;padding:14px 40px;transition:padding .35s var(--ease)}
.logo{display:block;flex:none}
.logo img{height:56px;width:auto;transition:height .35s var(--ease)}
.search{flex:1;display:flex;max-width:640px;margin-inline:auto;height:55px;background:#fff;border-radius:999px;overflow:hidden;transition:height .35s var(--ease)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 20px;font:inherit;font-size:18px;color:#000}
.search input::placeholder{color:#777}
.search button{width:84px;border:0;background:#4d4d4d;color:#fff;display:grid;place-items:center;transition:background .2s}
.search button:hover{background:#2b2b2b}
.search button svg{width:30px;height:30px}
.search:focus-within{box-shadow:0 0 0 3px #fff,0 0 0 6px #666}
.head-icons{display:flex;gap:22px;flex:none}
.hi{width:48px;height:48px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;text-decoration:none;transition:transform .2s var(--ease),width .35s var(--ease),height .35s var(--ease)}
.hi svg{width:26px;height:26px}
.hi:hover{transform:scale(1.08)}
.nav{border-top:1px solid #1d1d1d;max-height:44px;overflow:hidden;transition:max-height .35s var(--ease),opacity .25s var(--ease),border-color .3s}
.nav ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:43px}
.nav li{display:flex;align-items:center}
.nav li+li::before{content:"|";color:#fff;font-size:18px;margin:0 clamp(20px,5vw,72px) 2px}
.nav a{text-decoration:none;font-size:19px;text-transform:uppercase;position:relative;padding:4px 0;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}

/* zwinięty nagłówek po scrollu w dół */
.site-head.is-scrolled .topbar{max-height:0;opacity:0}
.site-head.is-scrolled .nav{max-height:0;opacity:0;border-color:transparent}
.site-head.is-scrolled .head-main{padding-top:8px;padding-bottom:8px}
.site-head.is-scrolled .logo img{height:40px}
.site-head.is-scrolled .search{height:44px}
.site-head.is-scrolled .hi{width:42px;height:42px}

/* ===== BUTTONY ===== */
.pill{display:flex;align-items:center;gap:0;background:#000;color:#fff;border:2px solid #000;border-radius:999px;text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:.02em;transition:transform .2s var(--ease),background .2s;overflow:hidden;position:relative}
.pill:hover{transform:translateY(-2px);background:#1c1c1c}
.pill .pi{flex:none;display:grid;place-items:center;background:#fff;color:#000;border-radius:50%}
.pill .pi svg{width:60%;height:60%}
.pill .pt{flex:1;text-align:center}

/* ===== FOOTER ===== */
.site-foot{background:#000;color:#fff;margin-top:64px}
.foot-in{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px 0;flex-wrap:wrap}
.foot-brand{display:flex;align-items:center;gap:14px;font-size:18px;text-transform:uppercase}
.foot-brand img{height:42px;width:auto}
.foot-links{display:flex;gap:40px;flex-wrap:wrap}
.foot-links a{text-decoration:none;font-size:18px;text-transform:uppercase;position:relative}
.foot-links a:hover{text-decoration:underline;text-underline-offset:5px}

/* ===== RESPONSYWNOŚĆ (wspólna) ===== */
@media (max-width:900px){
 .head-main{flex-wrap:wrap;gap:12px 14px;padding:12px 16px}
 .logo img{height:42px}
 .head-icons{margin-left:auto;gap:10px}
 .hi{width:42px;height:42px}
 .search{order:3;flex:1 0 100%;max-width:none;height:46px}
 .search input{font-size:16px}
 .search button{width:64px}
 .nav ul{justify-content:flex-start;overflow-x:auto;padding:0 16px;scrollbar-width:none}
 .nav ul::-webkit-scrollbar{display:none}
 .nav a{font-size:15px}
 .nav li+li::before{margin:0 18px 2px}
 .topbar{font-size:12px}
 .topbar-in{gap:14px;height:36px}
 .topbar{max-height:36px}
 .topbar svg{width:20px;height:20px}
 .wrap{width:calc(100% - 32px)}
 .foot-in{flex-direction:column;align-items:flex-start}
 .foot-links{gap:18px 26px}
 .foot-links a,.foot-brand{font-size:15px}
 .site-head.is-scrolled .search{height:40px;order:2;flex:1;min-width:0}
 .site-head.is-scrolled .head-main{flex-wrap:nowrap}
 .site-head.is-scrolled .logo img{height:32px}
 .site-head.is-scrolled .hi{width:38px;height:38px}
 .site-head.is-scrolled .head-icons{margin-left:0}
}
@media (max-width:560px){
 .topbar-in{justify-content:space-between}
 .topbar .t-mail span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.lk{width:min(760px,100% - 32px);margin:56px auto 0}
.lk h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:1.05}
.lk p.lead{margin:8px 0 34px;color:#555;font-size:18px}
.lk-list{display:flex;flex-direction:column;gap:16px;list-style:none;margin:0;padding:0}
.lk-list .pill{height:76px;font-size:22px}
.lk-list .pill .pi{width:70px;height:70px;margin-left:1px}
.lk-list .pill .pt{padding-right:70px}
.lk-list .pill .go{position:absolute;right:26px;top:50%;transform:translate(-8px,-50%);opacity:0;transition:.25s var(--ease);width:26px;height:26px}
.lk-list .pill:hover .go{opacity:1;transform:translate(0,-50%)}
.lk-list .pill .pt{padding-right:0}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:34px;font-weight:700;text-decoration:none}
.back svg{width:20px;height:20px}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.lk-list li{opacity:0;transform:translateY(10px);animation:in .5s var(--ease) forwards}
.lk-list li:nth-child(2){animation-delay:.08s}.lk-list li:nth-child(3){animation-delay:.16s}.lk-list li:nth-child(4){animation-delay:.24s}
@keyframes in{to{opacity:1;transform:none}}
@media (max-width:600px){
 .lk{margin-top:32px}
 .lk-list .pill{height:64px;font-size:17px}
 .lk-list .pill .pi{width:58px;height:58px}
 .lk-list .pill .go{display:none}
}
</style>
</head>
<body>

<script>
(function(){
 var head=document.querySelector('.site-head');
 var ticking=false;
 function onScroll(){
  var y=window.scrollY||document.documentElement.scrollTop;
  /* histereza, żeby nagłówek nie "drgał" przy zmianie wysokości */
  if(!head.classList.contains('is-scrolled') && y>90){head.classList.add('is-scrolled');}
  else if(head.classList.contains('is-scrolled') && y<12){head.classList.remove('is-scrolled');}
  ticking=false;
 }
 window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});
 onScroll();
 var f=document.getElementById('searchForm');
 if(f){f.addEventListener('submit',function(e){
   var q=document.getElementById('searchInput').value.trim();
   if(typeof window.__onSearch==='function'){e.preventDefault();window.__onSearch(q);}
   else{e.preventDefault();location.href='/?q='+encodeURIComponent(q)+'#baza-wiedzy';}
 });}
})();

/* Podmień adresy na swoje */
var LINKS=[
 {name:'TikTok',url:'https://www.tiktok.com/@o3k4rr',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9a7.3 7.3 0 0 0 4.2 1.3V7.2a4.3 4.3 0 0 1-3.1-1.4z" fill="currentColor" stroke="none"/></svg>'},
 {name:'Instagram',url:'https://www.instagram.com/o3k4rr',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>'},
 {name:'Discord',url:'https://discord.gg/o3k4rr',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18.3 18.3 0 0 0-6.4 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9-.2 13.5.2 18a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1L18 21a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.7-13.6zM8.5 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4z" fill="currentColor" stroke="none"/></svg>'},
 {name:'Strona internetowa',url:'https://o3k4rr.int.pl',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>'}
];
var GO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
