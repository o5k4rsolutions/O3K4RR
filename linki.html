<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficjalne linki – O3K4RR</title>
<meta name="description" content="Oficjalne linki O3K4RR: TikTok, Instagram, Discord i strona internetowa.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="https://o3k4rr.pages.dev/themes/favicon.svg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--white:#fff;--grey:#d9d9d9;--grey-d:#6b6b6b;--grey-l:#efefef;--r:22px;--ease:cubic-bezier(.4,0,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-size:15px;font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--black);background:var(--white);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px #000}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:min(1280px,100% - 48px);margin-inline:auto}

/* ===== HEADER ===== */
.site-head{position:sticky;top:0;z-index:50;background:#000;color:#fff;box-shadow:0 0 0 rgba(0,0,0,0);transition:box-shadow .3s var(--ease)}
.site-head.is-scrolled{box-shadow:0 6px 18px rgba(0,0,0,.25)}
.topbar{background:var(--grey);color:var(--grey-d);font-size:12px;letter-spacing:.03em;text-transform:uppercase;max-height:34px;overflow:hidden;transition:max-height .35s var(--ease),opacity .25s var(--ease)}
.topbar-in{height:34px;display:flex;justify-content:center;align-items:center;gap:32px;padding:0 16px}
.topbar a,.topbar span{display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.topbar svg{width:17px;height:17px}
.topbar a:hover{color:#000}
.head-main{display:flex;align-items:center;gap:24px;padding:12px 32px;transition:padding .35s var(--ease)}
.logo{display:block;flex:none}
.logo img{height:42px;width:auto;transition:height .35s var(--ease)}
.search{flex:1;display:flex;max-width:540px;margin-inline:auto;height:42px;background:#fff;border-radius:999px;overflow:hidden;transition:height .35s var(--ease)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 18px;font:inherit;font-size:14.5px;color:#000}
.search input::placeholder{color:#777}
.search button{width:60px;border:0;background:#4d4d4d;color:#fff;display:grid;place-items:center;transition:background .2s}
.search button:hover{background:#2b2b2b}
.search button svg{width:20px;height:20px}
.search:focus-within{box-shadow:0 0 0 3px #fff,0 0 0 6px #666}
.head-icons{display:flex;gap:12px;flex:none}
.hi{width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;text-decoration:none;transition:transform .2s var(--ease),width .35s var(--ease),height .35s var(--ease)}
.hi svg{width:21px;height:21px}
.hi{border:2px solid #fff;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s,width .35s var(--ease),height .35s var(--ease)}
.hi svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.hi:active{transform:scale(.92)}
@media (hover:hover){
 .hi:hover{transform:translateY(-3px);background:#000;color:#fff}
 .hi:hover svg{transform:rotate(-12deg) scale(1.12)}
 .search button:hover svg{transform:scale(1.18) rotate(-10deg)}
}
.search button svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.nav{border-top:1px solid #1d1d1d;max-height:40px;overflow:hidden;transition:max-height .35s var(--ease),opacity .25s var(--ease),border-color .3s}
.nav ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:39px}
.nav li{display:flex;align-items:center}
.nav li+li::before{content:"|";color:#444;font-size:13px;margin:0 clamp(18px,4vw,56px) 1px}
.nav a{text-decoration:none;font-size:13.5px;letter-spacing:.05em;font-weight:600;text-transform:uppercase;position:relative;padding:4px 0;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}

/* zwinięty nagłówek po scrollu w dół */
.site-head.is-scrolled .topbar{max-height:0;opacity:0}
.site-head.is-scrolled .nav{max-height:0;opacity:0;border-color:transparent}
.site-head.is-scrolled .head-main{padding-top:8px;padding-bottom:8px}
.site-head.is-scrolled .logo img{height:32px}
.site-head.is-scrolled .search{height:38px}
.site-head.is-scrolled .hi{width:36px;height:36px}

/* ===== BUTTONY ===== */
.pill{display:flex;align-items:center;gap:0;background:#000;color:#fff;border:2px solid #000;border-radius:999px;text-decoration:none;font-weight:700;text-transform:uppercase;letter-spacing:.03em;transition:transform .2s var(--ease),background .2s;overflow:hidden;position:relative}
.pill:hover{transform:translateY(-2px);background:#1c1c1c}
.pill .pi{flex:none;display:grid;place-items:center;background:#fff;color:#000;border-radius:50%}
.pill .pi svg{width:60%;height:60%}
.pill .pt{flex:1;text-align:center;position:relative;z-index:1}
.pill .pi{position:relative;z-index:1;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s}
.pill::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-130%);transition:transform .8s var(--ease);pointer-events:none}
.pill{transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s}
.pill:active{transform:translateY(0) scale(.97)!important;box-shadow:none!important}
@media (hover:hover){
 .pill:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.28)}
 .pill:hover::after{transform:translateX(130%)}
 .pill:hover .pi:first-child{transform:rotate(-14deg) scale(1.1)}
 .pill:hover .pi:last-child:not(:first-child){transform:rotate(14deg) scale(1.1)}
 .pill:hover .pi{background:#f2f2f2}
}

/* ===== FOOTER ===== */
.site-foot{background:#000;color:#fff;margin-top:64px}
.foot-in{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 0;flex-wrap:wrap}
.foot-brand{display:flex;align-items:center;gap:12px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.foot-brand img{height:30px;width:auto}
.foot-links{display:flex;gap:28px;flex-wrap:wrap}
.foot-links a{text-decoration:none;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;position:relative}
.foot-links a:hover{text-decoration:underline;text-underline-offset:5px}

/* ===== RESPONSYWNOŚĆ (wspólna) ===== */
@media (max-width:900px){
 .head-main{flex-wrap:wrap;gap:12px 14px;padding:12px 16px}
 .logo img{height:34px}
 .head-icons{margin-left:auto;gap:10px}
 .hi{width:36px;height:36px}
 .search{order:3;flex:1 0 100%;max-width:none;height:40px}
 .search input{font-size:14px}
 .search button{width:52px}
 .nav ul{justify-content:flex-start;overflow-x:auto;padding:0 16px;scrollbar-width:none}
 .nav ul::-webkit-scrollbar{display:none}
 .nav a{font-size:12px}
 .nav li+li::before{margin:0 14px 1px}
 .topbar{font-size:10.5px}
 .topbar-in{gap:12px;height:30px}
 .topbar{max-height:30px}
 .topbar svg{width:15px;height:15px}
 .wrap{width:calc(100% - 32px)}
 .foot-in{flex-direction:column;align-items:flex-start}
 .foot-links{gap:18px 26px}
 .foot-links a,.foot-brand{font-size:12px}
 .site-head.is-scrolled .search{height:36px;order:2;flex:1;min-width:0}
 .site-head.is-scrolled .head-main{flex-wrap:nowrap}
 .site-head.is-scrolled .logo img{height:28px}
 .site-head.is-scrolled .hi{width:34px;height:34px}
 .site-head.is-scrolled .head-icons{margin-left:0}
}
@media (max-width:560px){
 .topbar-in{justify-content:space-between}
 .topbar .t-mail span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.lk{width:min(640px,100% - 32px);margin:44px auto 0}
.lk h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1}
.lk p.lead{margin:6px 0 26px;color:#555;font-size:14.5px}
.lk-list{display:flex;flex-direction:column;gap:16px;list-style:none;margin:0;padding:0}
.lk-list .pill{height:62px;font-size:15px}
.lk-list .pill .pi{width:58px;height:58px;margin-left:1px}
.lk-list .pill .go{position:absolute;right:26px;top:50%;transform:translate(-8px,-50%);opacity:0;transition:.25s var(--ease);width:26px;height:26px}
.lk-list .pill:hover .go{opacity:1;transform:translate(0,-50%)}
.lk-list .pill .pt{padding-right:0}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:28px;font-size:13.5px;font-weight:700;text-decoration:none}
.back svg{width:17px;height:17px}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.lk-list li{opacity:0;transform:translateY(10px);animation:in .5s var(--ease) forwards}
.lk-list li:nth-child(2){animation-delay:.08s}.lk-list li:nth-child(3){animation-delay:.16s}.lk-list li:nth-child(4){animation-delay:.24s}
@keyframes in{to{opacity:1;transform:none}}
@media (max-width:600px){
 .lk{margin-top:32px}
 .lk-list .pill{height:54px;font-size:13.5px}
 .lk-list .pill .pi{width:50px;height:50px}
 .lk-list .pill .go{display:none}
}
</style>
</head>

<script>
(function(){
 var head=document.querySelector('.site-head');
 var ticking=false;
 function onScroll(){
  var y=window.scrollY||document.documentElement.scrollTop;
  /* histereza, żeby nagłówek nie "drgał" przy zmianie wysokości */
  if(!head.classList.contains('is-scrolled') && y>90 && (document.documentElement.scrollHeight-window.innerHeight)>320){head.classList.add('is-scrolled');}
  else if(head.classList.contains('is-scrolled') && y<12){head.classList.remove('is-scrolled');}
  ticking=false;
 }
 window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});
 onScroll();
 var f=document.getElementById('searchForm');
 if(f){f.addEventListener('submit',function(e){
   var q=document.getElementById('searchInput').value.trim();
   if(typeof window.__onSearch==='function'){e.preventDefault();window.__onSearch(q);}
   else{e.preventDefault();location.href='/?q='+encodeURIComponent(q)+'#baza-wiedzy';}
 });}
})();

/* Podmień adresy na swoje */
var LINKS=[

 {name:'Discord',url:'https://discord.gg/o3k4rr',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18.3 18.3 0 0 0-6.4 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9-.2 13.5.2 18a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1L18 21a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.7-13.6zM8.5 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4z" fill="currentColor" stroke="none"/></svg>'},
 {name:'Strona internetowa',url:'https://o3k4rr.int.pl',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>'}
