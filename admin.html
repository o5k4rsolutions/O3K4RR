<style>

.wrap{max-width:1100px;margin:0 auto;padding:0 22px}

nav{position:sticky;top:0;z-index:50;transition:all .35s cubic-bezier(.2,.8,.2,1);padding:22px 0;border-bottom:1px solid transparent}
nav.sm{padding:9px 0;background:rgba(11,15,23,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}

.links{display:flex;gap:6px;align-items:center}
.links a.l{color:var(--mut);padding:8px 14px;border-radius:999px;transition:.25s;font-weight:500}

.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;position:relative}

background:linear-gradient(180deg,var(--a1),var(--a2));
box-shadow:inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 6px rgba(160,70,0,.35),0 0 0 var(--ring-w) #0b0f17,0 0 0 calc(var(--ring-w) + 2px) var(--ring),0 10px 26px rgba(255,138,0,.28);
transition:transform .2s,box-shadow .25s,filter .25s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -3px 6px rgba(160,70,0,.35),0 0 0 3px #0b0f17,0 0 0 6px rgba(255,190,50,.6),0 14px 36px rgba(255,138,0,.5)}

h1{font-size:clamp(38px,6.4vw,72px);line-height:1.05;letter-spacing:-.03em;margin-bottom:22px}
h2{font-size:clamp(28px,4vw,42px);letter-spacing:-.02em;margin-bottom:14px}h3{font-size:20px;margin-bottom:8px}

.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}@media(max-width:820px){.cols{grid-template-columns:1fr}}

.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--tx);font:inherit;outline:0;transition:.25s}
.in:focus{border-color:var(--a2);box-shadow:0 0 0 4px rgba(255,138,0,.18)}textarea.in{min-height:150px;resize:vertical}
.fe{color:#ff7a7a;font-size:13px;margin-top:6px;max-height:0;opacity:0;overflow:hidden;transition:.3s}.fe.on{max-height:40px;opacity:1}.bad{border-color:#ff5c5c}
.hp{position:absolute;left:-9999px}
.sel{position:relative}.sel .in{display:flex;justify-content:space-between;cursor:pointer;text-align:left}
.opts{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.22s;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.sel.open .opts{opacity:1;transform:none;pointer-events:auto}.opts div{padding:12px 16px;cursor:pointer;transition:.2s}.opts div:hover,.opts div.on{background:rgba(255,138,0,.14);color:var(--a1)}
.sel .ar{transition:.25s}.sel.open .ar{transform:rotate(180deg)}
/* toast, modal, cookies */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:10px}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--a2);padding:14px 18px;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:ti .4s cubic-bezier(.2,.8,.2,1);max-width:340px}
.toast.err{border-left-color:#ff5c5c}.toast.out{opacity:0;transform:translateX(30px);transition:.3s}@keyframes ti{from{opacity:0;transform:translateX(40px)}}
#ck{position:fixed;left:18px;right:18px;bottom:18px;max-width:560px;z-index:150;background:rgba(22,29,46,.96);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:20px;transform:translateY(160%);transition:transform .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px rgba(0,0,0,.6)}
#ck.show{transform:none}#ck p{color:var(--mut);font-size:14px;margin-bottom:14px}#ck .row{gap:12px}
/* blog */
.post{cursor:pointer}.post time{color:var(--a1);font-size:13px;font-weight:600}.post h3{margin:6px 0}
.art{max-width:740px}.art p{margin-bottom:18px;color:#d5dbea;font-size:18px}.back{margin-bottom:24px}
.skel{height:170px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),#1e2840,var(--card));background-size:200% 100%;animation:sk 1.3s infinite}@keyframes sk{to{background-position:-200% 0}}
.legal h2{font-size:24px;margin:34px 0 10px}.legal p,.legal li{color:#c9d0e2;margin-bottom:10px}.legal ul{padding-left:22px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:14px}footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}footer a{color:var(--mut)}footer a:hover{color:var(--a1)}
.e404{text-align:center;min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
.e404 .big{font-size:clamp(90px,22vw,220px);font-weight:900;line-height:1;letter-spacing:-.05em;position:relative}
.rail{width:min(420px,80vw);height:4px;background:var(--line);border-radius:4px;margin:18px auto 30px;position:relative;overflow:hidden}
.rail:after{content:"";position:absolute;top:0;left:-30%;width:30%;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2));animation:rl 2.2s ease-in-out infinite}@keyframes rl{to{left:100%}}
.shake{animation:sh 3s ease-in-out infinite}@keyframes sh{0%,90%,100%{transform:none}93%{transform:translateX(-8px) rotate(-1deg)}96%{transform:translateX(8px) rotate(1deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:10px 20px;border-radius:999px;cursor:pointer;font:600 15px inherit;font-family:inherit;transition:.25s}.tabs button.on{color:#2a1700;background:linear-gradient(180deg,var(--a1),var(--a2));border-color:transparent}

#md .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;width:min(640px,100%);max-height:90vh;overflow:auto;transform:scale(.95);transition:.25s}#md.on .box{transform:none}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}.sw i{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.25s}.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}.sw.on i{background:var(--a2)}.sw.on i:after{left:21px}
</style>
<section><div class="wrap"><div id="lg" style="max-width:420px"><h1>Admin</h1><p class="lead">Zaloguj się, aby zarządzać stroną.</p>

<script>
const SB_URL='https://uiuostyvlxwgzyyalwgb.supabase.co',SB_KEY='sb_publishable_6cF9ktyv9qN5z-9-EkmOrQ_jWyyIVUB';
let sb=null;try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,err){let t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},4200)}
const nav=$('nav');addEventListener('scroll',()=>nav.classList.toggle('sm',scrollY>40),{passive:true});nav.classList.toggle('sm',scrollY>40);
$('.burger').onclick=e=>{e.currentTarget.classList.toggle('x');$('.links').classList.toggle('open')};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function reveal(){$$('.rv:not(.in)').forEach((el,i)=>{el.style.transitionDelay=(i%4)*80+'ms';io.observe(el)})}reveal();
(function(){let c='';try{c=localStorage.getItem('o3k_ck')}catch(e){}if(c)return;const b=$('#ck');setTimeout(()=>b.classList.add('show'),900);
$$('[data-ck]',b).forEach(x=>x.onclick=()=>{try{localStorage.setItem('o3k_ck',x.dataset.ck)}catch(e){}b.classList.remove('show')})})();

const lg=$('#lg'),pn=$('#pn'),ct=$('#ct'),md=$('#md'),mb=$('#mb');let tab='p';
const fd=d=>new Date(d).toLocaleString('pl-PL');
function modal(h){mb.innerHTML=h;md.classList.add('on')}function close(){md.classList.remove('on')}
md.onclick=e=>{if(e.target===md)close()};
function ask(t,y){return new Promise(r=>{modal(`<h3>${esc(t)}</h3><div class="row" style="margin-top:18px"><button class="btn sm" id="y">${y}</button><button class="btn sm ghost" id="n">Anuluj</button></div>`);$('#y').onclick=()=>{close();r(true)};$('#n').onclick=()=>{close();r(false)}})}
async function gate(){const {data}=await sb.auth.getSession();const on=!!data.session;lg.hidden=on;pn.hidden=!on;if(on)load()}
$('#lf').onsubmit=async e=>{e.preventDefault();const f=e.target;if(!f.e.value.trim()||!f.p.value)return toast('Podaj e-mail i hasło.',true);
 const {error}=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});if(error)return toast('Błędne dane logowania.',true);f.p.value='';gate()};
$('#lo').onclick=async()=>{await sb.auth.signOut();gate()};
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;load()});
function load(){tab==='p'?posts():leads()}
async function posts(){ct.innerHTML='<div class="skel"></div>';const {data,error}=await sb.from('posts').select('*').order('published_at',{ascending:false});
 if(error)return toast('Błąd odczytu wpisów.',true);
 ct.innerHTML='<button class="btn sm" id="np" style="margin-bottom:20px">+ Nowy wpis</button>'+data.map(p=>`<div class="card it"><div><h3 style="margin:0">${esc(p.title)}</h3><small>/${esc(p.slug)} · ${fd(p.published_at)}</small> <span class="pill ${p.published?'ok':''}">${p.published?'opublikowany':'szkic'}</span></div><div class="row" style="gap:10px"><button class="btn sm ghost" data-e="${p.id}">Edytuj</button><button class="btn sm ghost" data-d="${p.id}">Usuń</button></div></div>`).join('');
 $('#np').onclick=()=>edit({});
 $$('[data-e]').forEach(b=>b.onclick=()=>edit(data.find(p=>p.id===b.dataset.e)));
 $$('[data-d]').forEach(b=>b.onclick=async()=>{if(!await ask('Usunąć ten wpis?','Usuń'))return;const {error}=await sb.from('posts').delete().eq('id',b.dataset.d);error?toast('Nie udało się usunąć.',true):(toast('Wpis usunięty.'),posts())})}
const slugify=s=>s.toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function edit(p){let pub=!!p.published;
 modal(`<h3>${p.id?'Edytuj wpis':'Nowy wpis'}</h3><div class="f" style="margin-top:14px;max-width:none"><div><label>Tytuł</label><input class="in" id="t" value="${esc(p.title)}"></div><div><label>Slug (adres)</label><input class="in" id="s" value="${esc(p.slug)}"></div><div><label>Zajawka</label><input class="in" id="x" value="${esc(p.excerpt)}"></div><div><label>Treść (akapity oddziel pustą linią)</label><textarea class="in" id="c" style="min-height:200px">${esc(p.content)}</textarea></div><div class="sw ${pub?'on':''}" id="sw"><i></i>Opublikowany</div><div class="row"><button class="btn sm" id="sv">Zapisz</button><button class="btn sm ghost" id="cx">Anuluj</button></div></div>`);
 $('#sw').onclick=e=>{pub=!pub;e.currentTarget.classList.toggle('on',pub)};$('#cx').onclick=close;
 $('#sv').onclick=async()=>{const t=$('#t').value.trim(),s=slugify($('#s').value||t);if(!t||!s||!$('#c').value.trim())return toast('Uzupełnij tytuł i treść.',true);
  const row={title:t,slug:s,excerpt:$('#x').value.trim(),content:$('#c').value,published:pub};

  const q=p.id?sb.from('posts').update(row).eq('id',p.id):sb.from('posts').insert(row);const {error}=await q;
  if(error)return toast('Błąd zapisu (czy slug jest unikalny?).',true);close();toast('Zapisano.');posts()}}
const ST=['new','in_progress','done','spam'],SL={new:'Nowe',in_progress:'W toku',done:'Zakończone',spam:'Spam'};
async function leads(){ct.innerHTML='<div class="skel"></div>';const {data,error}=await sb.from('leads').select('*').order('created_at',{ascending:false});
 if(error)return toast('Błąd odczytu zgłoszeń.',true);if(!data.length){ct.innerHTML='<p class="lead">Brak zgłoszeń.</p>';return}
 ct.innerHTML=data.map(l=>`<div class="card"><div class="it"><div><h3 style="margin:0">${esc(l.name)} · <a href="mailto:${esc(l.email)}">${esc(l.email)}</a></h3><small>${esc(l.topic)} · ${fd(l.created_at)}</small></div><span class="pill ${l.status==='done'?'ok':''}">${SL[l.status]||esc(l.status)}</span></div><p style="white-space:pre-wrap;margin-bottom:14px">${esc(l.message)}</p><div class="row" style="gap:10px"><button class="btn sm ghost" data-o="${l.id}">Zmień status / notatka</button><button class="btn sm ghost" data-x="${l.id}">Usuń</button></div></div>`).join('');
